<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密钥生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        accent: '#8b5cf6',
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .btn-active {
                @apply bg-primary text-white;
            }
            .btn-hover {
                @apply transition-all duration-200 hover:shadow-md hover:-translate-y-0.5;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden">
        <div class="bg-gradient-to-r from-primary to-accent p-6 text-white text-center">
            <h1 class="text-2xl font-bold mb-2">密钥生成器</h1>
            <p class="opacity-90">生成用于五星做号模块的访问密钥</p>
        </div>
        
        <div class="p-6">
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2">选择密钥有效期</label>
                <div class="grid grid-cols-2 gap-3" id="durationButtons">
                    <button data-minutes="1" class="px-4 py-3 border rounded-lg btn-hover btn-active">1分钟</button>
                    <button data-days="3" class="px-4 py-3 border rounded-lg btn-hover">3天</button>
                    <button data-days="7" class="px-4 py-3 border rounded-lg btn-hover">7天</button>
                    <button data-days="30" class="px-4 py-3 border rounded-lg btn-hover">30天</button>
                    <button data-days="90" class="px-4 py-3 border rounded-lg btn-hover">90天</button>
                    <button data-days="365" class="px-4 py-3 border rounded-lg btn-hover">365天</button>
                </div>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2">生成的密钥</label>
                <div class="relative">
                    <input type="text" id="keyOutput" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary" readonly>
                    <button id="copyBtn" class="absolute right-2 top-2 bg-gray-200 hover:bg-gray-300 p-2 rounded-lg transition-colors">
                        <i class="fa fa-copy"></i>
                    </button>
                </div>
            </div>
            
            <button id="generateBtn" class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 btn-hover">
                <i class="fa fa-key"></i>
                <span>生成新密钥</span>
            </button>
        </div>
        
        <div class="bg-gray-50 p-4 text-center text-sm text-gray-500">
            <p>密钥生成后，请复制到五星做号模块进行验证</p>
        </div>
    </div>

    <script>
        // 检查crypto.subtle API支持
        function isCryptoSubtleSupported() {
            return typeof crypto !== 'undefined' && 
                   typeof crypto.subtle !== 'undefined' && 
                   typeof crypto.subtle.importKey === 'function';
        }
        
        // 全局变量
        let selectedDays = 1/(24*60); // 默认1分钟
        
        // DOM元素
        const durationButtons = document.querySelectorAll('#durationButtons button');
        const generateBtn = document.getElementById('generateBtn');
        const keyOutput = document.getElementById('keyOutput');
        const copyBtn = document.getElementById('copyBtn');
        
        // 页面加载时检查浏览器兼容性
        document.addEventListener('DOMContentLoaded', () => {
            if (!isCryptoSubtleSupported()) {
                showNotification('检测到您使用的是旧版浏览器，密钥生成将使用兼容模式', 'warning');
            }
        });
        
        // 单选按钮组
        durationButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                durationButtons.forEach(b => b.classList.remove('btn-active'));
                btn.classList.add('btn-active');
                if (btn.dataset.minutes) {
                    selectedDays = parseInt(btn.dataset.minutes) / (24 * 60); // 转换分钟为天数
                } else {
                    selectedDays = parseInt(btn.dataset.days);
                }
            });
        });
        
        // 生成密钥
        generateBtn.addEventListener('click', async () => {
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 生成中...';
            
            try {
                // 检查浏览器兼容性
                if (!isCryptoSubtleSupported()) {
                    showNotification('检测到旧版浏览器，正在使用兼容模式...', 'warning');
                    await new Promise(resolve => setTimeout(resolve, 1000)); // 给用户时间看到提示
                }
                
                const key = await generateSecureKey(selectedDays);
                if (key) {
                    keyOutput.value = key;
                    const compatMode = !isCryptoSubtleSupported() ? ' (兼容模式)' : '';
                    showNotification('短密钥已生成 (长度: ' + key.length + ' 字符)' + compatMode);
                } else {
                    showNotification('密钥生成失败', 'error');
                }
            } catch (error) {
                console.error('生成密钥时出错:', error);
                let errorMsg = '密钥生成失败: ' + error.message;
                if (error.message.includes('浏览器不支持加密API')) {
                    errorMsg = '您的浏览器版本过旧，请升级到最新版本的Chrome、Firefox、Safari或Edge浏览器';
                }
                showNotification(errorMsg, 'error');
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<i class="fa fa-key"></i> <span>生成新密钥</span>';
            }
        });
        
        // 复制到剪贴板
        copyBtn.addEventListener('click', () => {
            if (keyOutput.value) {
                keyOutput.select();
                document.execCommand('copy');
                showNotification('密钥已复制到剪贴板');
            }
        });
        
        // 显示通知
        function showNotification(message, type = 'success') {
            // 检查是否已有通知
            let notification = document.querySelector('.notification');
            if (notification) {
                notification.remove();
            }
            
            // 创建新通知
            notification = document.createElement('div');
            let bgColor = 'bg-green-500';
            if (type === 'error') {
                bgColor = 'bg-red-500';
            } else if (type === 'warning') {
                bgColor = 'bg-yellow-500';
            }
            notification.className = `notification fixed bottom-4 right-4 ${bgColor} text-white px-4 py-2 rounded-lg shadow-lg z-50`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            // 根据类型设置不同的显示时间
            const displayTime = type === 'warning' ? 3000 : 2000;
            setTimeout(() => {
                notification.classList.add('opacity-0', 'transition-opacity', 'duration-300');
                setTimeout(() => notification.remove(), 300);
            }, displayTime);
        }
        
        // Base62编码字符集
        const BASE62_CHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
        
        // Base62编码函数
        function encodeBase62(bytes) {
            let result = '';
            let num = 0n;
            
            // 将字节数组转换为大整数
            for (let i = 0; i < bytes.length; i++) {
                num = num * 256n + BigInt(bytes[i]);
            }
            
            // 转换为Base62
            if (num === 0n) return '0';
            
            while (num > 0n) {
                result = BASE62_CHARS[Number(num % 62n)] + result;
                num = num / 62n;
            }
            
            return result;
        }
        
        // Base62解码函数
        function decodeBase62(str) {
            let num = 0n;
            
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                const index = BASE62_CHARS.indexOf(char);
                if (index === -1) throw new Error('Invalid Base62 character');
                num = num * 62n + BigInt(index);
            }
            
            // 转换为字节数组
            const bytes = [];
            while (num > 0n) {
                bytes.unshift(Number(num % 256n));
                num = num / 256n;
            }
            
            return new Uint8Array(bytes);
        }
        
        // PBKDF2-HMAC-SHA256实现（Web Crypto API版本）
        async function pbkdf2WebCrypto(password, salt, iterations, keyLength) {
            const encoder = new TextEncoder();
            const passwordKey = await crypto.subtle.importKey(
                'raw',
                encoder.encode(password),
                { name: 'PBKDF2' },
                false,
                ['deriveBits']
            );
            
            const derivedBits = await crypto.subtle.deriveBits(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: iterations,
                    hash: 'SHA-256'
                },
                passwordKey,
                keyLength * 8
            );
            
            return new Uint8Array(derivedBits);
        }
        
        // PBKDF2-HMAC-SHA256降级实现（纯JavaScript）
        async function pbkdf2Fallback(password, salt, iterations, keyLength) {
            // 简化的HMAC-SHA256实现
            async function hmacSha256(key, data) {
                const keyBytes = typeof key === 'string' ? new TextEncoder().encode(key) : key;
                const dataBytes = typeof data === 'string' ? new TextEncoder().encode(data) : data;
                
                // 使用crypto.subtle.digest作为SHA256（如果可用）
                if (typeof crypto !== 'undefined' && typeof crypto.subtle !== 'undefined' && typeof crypto.subtle.digest === 'function') {
                    const blockSize = 64; // SHA256 block size
                    let keyPadded = new Uint8Array(blockSize);
                    
                    if (keyBytes.length > blockSize) {
                        const hashedKey = await crypto.subtle.digest('SHA-256', keyBytes);
                        keyPadded.set(new Uint8Array(hashedKey));
                    } else {
                        keyPadded.set(keyBytes);
                    }
                    
                    const oKeyPad = new Uint8Array(blockSize);
                    const iKeyPad = new Uint8Array(blockSize);
                    
                    for (let i = 0; i < blockSize; i++) {
                        oKeyPad[i] = keyPadded[i] ^ 0x5c;
                        iKeyPad[i] = keyPadded[i] ^ 0x36;
                    }
                    
                    const innerData = new Uint8Array(iKeyPad.length + dataBytes.length);
                    innerData.set(iKeyPad);
                    innerData.set(dataBytes, iKeyPad.length);
                    
                    const innerHash = await crypto.subtle.digest('SHA-256', innerData);
                    
                    const outerData = new Uint8Array(oKeyPad.length + innerHash.byteLength);
                    outerData.set(oKeyPad);
                    outerData.set(new Uint8Array(innerHash), oKeyPad.length);
                    
                    const finalHash = await crypto.subtle.digest('SHA-256', outerData);
                    return new Uint8Array(finalHash);
                } else {
                    // 如果连digest都不支持，使用更简单的哈希
                    throw new Error('浏览器不支持加密API，请使用现代浏览器');
                }
            }
            
            const passwordBytes = new TextEncoder().encode(password);
            const saltBytes = new Uint8Array(salt);
            
            let result = new Uint8Array(keyLength);
            let blockIndex = 1;
            let resultOffset = 0;
            
            while (resultOffset < keyLength) {
                // 创建块索引的字节表示
                const blockIndexBytes = new Uint8Array(4);
                blockIndexBytes[0] = (blockIndex >>> 24) & 0xFF;
                blockIndexBytes[1] = (blockIndex >>> 16) & 0xFF;
                blockIndexBytes[2] = (blockIndex >>> 8) & 0xFF;
                blockIndexBytes[3] = blockIndex & 0xFF;
                
                // 第一次HMAC：salt + blockIndex
                const saltWithIndex = new Uint8Array(saltBytes.length + 4);
                saltWithIndex.set(saltBytes);
                saltWithIndex.set(blockIndexBytes, saltBytes.length);
                
                let u = await hmacSha256(passwordBytes, saltWithIndex);
                let result_block = new Uint8Array(u);
                
                // 迭代HMAC
                for (let i = 1; i < iterations; i++) {
                    u = await hmacSha256(passwordBytes, u);
                    for (let j = 0; j < u.length; j++) {
                        result_block[j] ^= u[j];
                    }
                }
                
                // 复制到结果中
                const copyLength = Math.min(result_block.length, keyLength - resultOffset);
                result.set(result_block.slice(0, copyLength), resultOffset);
                resultOffset += copyLength;
                blockIndex++;
            }
            
            return result;
        }
        
        // 统一的PBKDF2接口
        async function pbkdf2(password, salt, iterations, keyLength) {
            if (isCryptoSubtleSupported()) {
                try {
                    return await pbkdf2WebCrypto(password, salt, iterations, keyLength);
                } catch (error) {
                    console.warn('Web Crypto API失败，使用降级方案:', error);
                    return await pbkdf2Fallback(password, salt, iterations, keyLength);
                }
            } else {
                console.warn('浏览器不支持Web Crypto API，使用降级方案');
                return await pbkdf2Fallback(password, salt, iterations, keyLength);
            }
        }
        
        // 新的短密钥生成函数
        async function generateSecureKey(days) {
            try {
                // 计算过期时间戳
                const expirationDate = new Date();
                if (days < 1) {
                    expirationDate.setMinutes(expirationDate.getMinutes() + Math.round(days * 24 * 60));
                } else {
                    expirationDate.setDate(expirationDate.getDate() + days);
                }
                
                const expiryTimestamp = Math.floor(expirationDate.getTime() / 1000);
                
                // 使用时间戳生成确定性盐（8字节）
                 const salt = new Uint8Array(8);
                 salt[0] = (expiryTimestamp >>> 24) & 0xFF;
                 salt[1] = (expiryTimestamp >>> 16) & 0xFF;
                 salt[2] = (expiryTimestamp >>> 8) & 0xFF;
                 salt[3] = expiryTimestamp & 0xFF;
                 salt[4] = (expiryTimestamp >>> 24) & 0xFF; // 重复填充
                 salt[5] = (expiryTimestamp >>> 16) & 0xFF;
                 salt[6] = (expiryTimestamp >>> 8) & 0xFF;
                 salt[7] = expiryTimestamp & 0xFF;
                
                // 固定密钥用于PBKDF2（实际应用中应该更安全地存储）
                const masterKey = 'TWPK_SECURE_KEY_2024';
                
                // 使用PBKDF2生成12字节哈希
                const hash = await pbkdf2(masterKey + expiryTimestamp, salt, 10000, 12);
                
                // 构建16字节的keyData：4字节时间戳 + 12字节哈希
                 const keyData = new Uint8Array(16);
                 
                 // 前4字节：过期时间戳（大端序）
                 keyData[0] = (expiryTimestamp >>> 24) & 0xFF;
                 keyData[1] = (expiryTimestamp >>> 16) & 0xFF;
                 keyData[2] = (expiryTimestamp >>> 8) & 0xFF;
                 keyData[3] = expiryTimestamp & 0xFF;
                 
                 // 后12字节：哈希值
                 keyData.set(hash, 4);
                
                // 使用Base62编码
                const shortKey = encodeBase62(keyData);
                
                // 存储盐值用于验证（实际应用中可能需要其他方式）
                const keyInfo = {
                    key: shortKey,
                    salt: Array.from(salt),
                    expiry: expiryTimestamp
                };
                
                // 临时存储到localStorage用于演示
                localStorage.setItem('keyInfo_' + shortKey, JSON.stringify(keyInfo));
                
                return shortKey;
                
            } catch (e) {
                console.error('密钥生成失败:', e);
                alert('密钥生成错误: ' + e.message);
                return null;
            }
        }
    </script>
</body>
</html>
